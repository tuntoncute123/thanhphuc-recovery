<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 68" fill="none">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="60%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="cyanGlowLogo" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Left Icon Emblem -->
  <g transform="translate(4, 4) scale(0.6)">
    <!-- Hexagonal Shield Base -->
    <polygon points="50,6 88,24 88,68 50,94 12,68 12,24" fill="url(#shieldGrad)" stroke="#38bdf8" stroke-width="3" />
    
    <!-- Hard Drive & Memory Chip Tracks -->
    <circle cx="50" cy="50" r="28" stroke="#0ea5e9" stroke-width="3.5" stroke-dasharray="8 4" opacity="0.85" />
    <circle cx="50" cy="50" r="16" fill="#0f172a" stroke="#38bdf8" stroke-width="2.5" />
    <circle cx="50" cy="50" r="6" fill="#38bdf8" filter="url(#cyanGlowLogo)" />

    <!-- Magnetic Read Head Actuator -->
    <path d="M 50 50 L 76 34" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
    <circle cx="76" cy="34" r="4" fill="#38bdf8" />

    <!-- Data Recovery Pulse -->
    <path d="M 22 50 Q 30 38, 38 50 T 50 50 T 62 50 T 78 50" fill="none" stroke="#10b981" stroke-width="2.5" />
  </g>

  <!-- Typography -->
  <text x="74" y="32" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="900" font-size="21" fill="#0f172a" letter-spacing="-0.5">
    THÀNH PHÚC <tspan fill="#0284c7">DATA RECOVERY</tspan>
  </text>
  
  <!-- Verified Badge -->
  <g transform="translate(328, 17) scale(0.85)">
    <circle cx="12" cy="12" r="11" fill="#1877F2" />
    <path d="M7 12.5 L10.5 16 L17 8.5" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <text x="75" y="51" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="700" font-size="8.5" fill="#0369a1" letter-spacing="0.8">
    KHÔI PHỤC DỮ LIỆU THẺ NHỚ • Ổ CỨNG • USB • DRIVE
  </text>
</svg>
