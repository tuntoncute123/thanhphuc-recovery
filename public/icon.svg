<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Hexagonal Shield Base -->
  <polygon points="50,6 88,24 88,68 50,94 12,68 12,24" fill="url(#primaryGrad)" stroke="#38bdf8" stroke-width="2.5" />
  
  <!-- Hard Drive Platter Ring -->
  <circle cx="50" cy="50" r="28" stroke="#0ea5e9" stroke-width="3" stroke-dasharray="8 4" opacity="0.8" />
  <circle cx="50" cy="50" r="16" fill="#0f172a" stroke="#38bdf8" stroke-width="2" />
  <circle cx="50" cy="50" r="6" fill="#38bdf8" filter="url(#glow)" />

  <!-- Magnetic Read Head Actuator -->
  <path d="M 50 50 L 76 34" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />
  <circle cx="76" cy="34" r="3.5" fill="#38bdf8" />

  <!-- Data Recovery Pulse Wave -->
  <path d="M 22 50 Q 30 38, 38 50 T 50 50 T 62 50 T 78 50" fill="none" stroke="#10b981" stroke-width="1.8" opacity="0.9" />
</svg>
